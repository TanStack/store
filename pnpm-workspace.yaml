cleanupUnusedCatalogs: true
linkWorkspacePackages: true
preferWorkspacePackages: true
blockExoticSubdeps: true
trustPolicy: 'no-downgrade'
minimumReleaseAge: 1440

trustPolicyExclude:
  - 'chokidar@4.0.3' # Socket: popular, 193M weekly downloads; alerts page returned no alert entries
  - 'semver@5.7.2' # Socket: popular legacy line, 673M weekly downloads; alerts page returned no alert entries
  - 'semver@6.3.1' # Socket: popular latest-6 line, 673M weekly downloads; alerts page returned no alert entries

packageExtensions:
  '@vue/test-utils@2.4.6':
    peerDependencies:
      # Use the consumer's Vue runtime for rendering and reactivity.
      vue: '^3.0.0'

packages:
  - 'packages/**'
  - 'examples/angular/**'
  - 'examples/react/**'
  - 'examples/solid/**'
  - 'examples/vue/**'
  - 'examples/svelte/**'
  - 'examples/preact/**'
  - 'examples/lit/**'
  - 'examples/octane/**'

allowBuilds:
  # root dependency
  nx: true
  unrs-resolver: false # not directly required for build (could enable for better build perf)
  esbuild: true

  # @angular/build
  '@parcel/watcher': false # optional dep of @angular/build
  lmdb: false # optional dep of @angular/build
  msgpackr-extract: false # optional dep of @angular/build
minimumReleaseAgeExclude:
  # Renovate security update: nx@22.7.7 || 22.7.10
  - nx@22.7.7 || 22.7.10
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11
  # Renovate security update: @angular/router@21.2.24
  - '@angular/router@21.2.24'
  # octane adapter upgrade: octane@0.12.1
  - octane@0.12.1
  # Renovate security update: vite@7.3.5
  - vite@7.3.5
  # Solid 2.0 stable: published 2026-11-17, less than 24 hours ago
  - 'solid-js@2.0.0'
  - '@solidjs/signals@2.0.0'
  - '@solidjs/web@2.0.0'
  - '@solidjs/vite-plugin@3.0.0'
  - '@solidjs/compiler@2.0.0'
  - '@solidjs/compiler-darwin-arm64@2.0.0'
  - '@solidjs/compiler-darwin-x64@2.0.0'
  - '@solidjs/compiler-linux-arm64-gnu@2.0.0'
  - '@solidjs/compiler-linux-x64-gnu@2.0.0'
  - '@solidjs/compiler-wasm32-wasi@2.0.0'
  - '@solidjs/compiler-win32-x64-msvc@2.0.0'
